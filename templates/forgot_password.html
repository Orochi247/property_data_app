<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Houzeo Data Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f4f7fb; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { background: #ffffff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04); padding: 3rem 2rem; width: 100%; max-width: 400px; }
        .form-control { border-radius: 8px; padding: 0.75rem 1rem; }
        .btn-brand { background-color: #0066cc; color: white; border-radius: 8px; padding: 0.8rem; font-weight: 600; width: 100%; }
        .btn-brand:hover { background-color: #0052a3; color: white; }
        .brand-link { color: #0066cc; text-decoration: none; }
        .brand-link:hover { text-decoration: underline; }
    </style>
</head>
<body class="login-wrapper">
    <div class="login-card">
        <div class="text-center mb-4">
            <h2 style="color: #0066cc; font-weight: 800; letter-spacing: -1px;">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" style="margin-top: -6px;">
                    <path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3zm0 2.7l5 4.5V18h-2v-6H9v6H7v-7.8l5-4.5z"/>
                </svg>
                Houzeo
            </h2>
            <p class="text-muted fw-bold">Reset Password</p>
            <p class="text-muted mt-2 mb-0" style="font-size: 0.85rem; line-height: 1.5;">Enter your username. Your Admin will review the request and issue a temporary password.</p>
        </div>
        
        <form method="POST" action="/forgot_password">
            <div class="mb-4">
                <label class="form-label fw-bold text-muted" style="font-size: 0.85rem;">User ID (Name)</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <button type="submit" class="btn btn-brand">Request Reset</button>
        </form>

        <div class="text-center mt-4">
            <a href="/login" class="brand-link fw-bold" style="font-size: 0.85rem;">Back to Login</a>
        </div>
    </div>
</body>
</html>
