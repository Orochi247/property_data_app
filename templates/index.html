<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Houzeo Autofill Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="wave-background">
        <div class='air air1'></div>
        <div class='air air2'></div>
        <div class='air air3'></div>
        <div class='air air4'></div>
    </div>
    <div class="container py-3" style="max-width: 900px;">
        
     <div class="modern-card header-card d-flex align-items-center mb-4 p-3 px-4">
            
            <div class="header-brand flex-grow-1">
                <h1 style="color: var(--houzeo-blue); font-weight: 800; font-size: 2.2rem; letter-spacing: -1px; margin-bottom: 0;">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" style="margin-top: -6px;">
                        <path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3zm0 2.7l5 4.5V18h-2v-6H9v6H7v-7.8l5-4.5z"/>
                    </svg>
                    Houzeo<span style="color: #333; font-size: 1.2rem; vertical-align: middle;"> Autofill Tracker</span>
                </h1>
            </div>

            <div class="header-divider"></div>

            <div class="header-user d-flex align-items-center justify-content-end" style="min-width: 250px;">
                <span class="text-muted fw-bold me-3" style="font-size: 0.95rem;">
                    Agent: <span class="text-dark">{{ current_user }}</span>
                </span>
                <a href="/logout" class="btn btn-sm btn-outline-danger rounded-pill fw-bold px-3 py-2">Logout</a>
            </div>
            
        </div>   

        <div id="msg" class="mb-4 text-center"></div>

        <div class="modern-card">
            <form id="dataForm">
                
                <div class="step-header">
                    <div class="step-badge">1</div>
                    <h3 class="step-title">Record Identification</h3>
                </div>
                <div class="row mb-4">
                    <div class="col-md-12">
                        <label for="hid" class="form-label">Property HID</label>
                        <input type="text" class="form-control" id="hid" placeholder="Enter Property HID..." required>
                    </div>
                </div>

                <div class="step-header mt-4">
                    <div class="step-badge">2</div>
                    <h3 class="step-title">Property Specifications</h3>
                </div>
                <div class="mb-4">
                    <label for="mls_name" class="form-label">MLS Name</label>
                    <select class="form-select searchable-select" id="mls_name" required>
                        <option value="" disabled selected>Search MLS Database...</option>
                        {% for mls in mls_list %}
                            <option value="{{ mls }}">{{ mls }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="row mb-4">
                    <div class="col-md-4 mb-3 mb-md-0">
                        <label for="prop_type" class="form-label">Property Type</label>
                        <select class="form-select" id="prop_type" required>
                            <option value="" disabled selected>Select...</option>
                            <option value="Residential">Residential</option>
                            <option value="Multi Family">Multi Family</option>
                            <option value="Condominium">Condominium</option>
                            <option value="Town House">Town House</option>
                            <option value="Mobile">Mobile</option>
                            <option value="Land">Land</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3 mb-md-0">
                        <label for="home_type" class="form-label">Home Type</label>
                        <select class="form-select" id="home_type" required>
                            <option value="" disabled selected>Select...</option>
                            <option value="Single Family Residence">Single Family Residence</option>
                            <option value="Condo">Condo</option>
                            <option value="Mobile">Mobile</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="listing_date" class="form-label">Listing Date</label>
                        <input type="date" class="form-control" id="listing_date" required>
                    </div>
                </div>

                <div class="step-header mt-4">
                    <div class="step-badge">3</div>
                    <h3 class="step-title">Status & Tracking</h3>
                </div>
                <div class="row mb-4">
                    <div class="col-md-4 mb-3 mb-md-0">
                        <label for="status" class="form-label">Record Status</label>
                        <select class="form-select" id="status" required>
                            <option value="" disabled selected>Select status...</option>
                            <option value="Found">Data Found</option>
                            <option value="Not Found">Not Found</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3 mb-md-0">
                        <label for="start_time" class="form-label">Start Time</label>
                        <input type="text" class="form-control time-picker" id="start_time" placeholder="HH:MM:SS" required>
                    </div>
                    <div class="col-md-4">
                        <label for="end_time" class="form-label">End Time</label>
                        <input type="text" class="form-control time-picker" id="end_time" placeholder="HH:MM:SS" required>
                    </div>
                </div>

                <div class="mt-5">
                    <button type="submit" id="submitBtn" class="btn btn-primary w-100 fw-bold concept-btn mt-3">
    <span class="btn-text">Save Entry</span>
</button>
                </div>
            </form>
        </div>

        <div class="modern-card p-0 overflow-hidden">
            <div class="d-flex flex-wrap justify-content-between align-items-center p-3 p-md-4 border-bottom gap-2">
                <h5 class="fw-bold mb-0" style="color: var(--houzeo-blue);">Recent Submissions</h5>
                
                <button type="button" class="btn btn-sm btn-outline-secondary fw-bold rounded-pill px-3 text-nowrap" onclick="refreshTable()">
                    🔄 Refresh Data
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-custom table-hover mb-0 w-100" id="entriesTable">
                    <thead>
                        <tr>
                            <th>HID</th>
                            <th>Agent</th>
                            <th>MLS / Property Details</th>
                            <th>Status</th>
                            <th>Time Log</th>
                            <th class="text-end" style="vertical-align: middle;">
    <div style="padding-right: 2.8rem; width: 100%; display: block;">ACTION</div>
</th>
                        </tr>
                    </thead>
                    <tbody id="entriesBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <script>
    let isEditMode = false;

    // --- 1. Fetch & Render Table ---
    async function refreshTable() {
        try {
            const res = await fetch('/get_recent'); // Make sure this matches your Flask route!
            const data = await res.json();
            let html = '';
            
            data.forEach(row => {
                const rowDataStr = encodeURIComponent(JSON.stringify(row));
                const isFound = (row[6] === 'Found' || row[6] === 'Data Found');
                
                html += `<tr>
                    <td data-label="HID"><span class="fw-bold">${row[0]}</span></td>
                    <td data-label="AGENT">${row[1]}</td>
                    <td data-label="PROPERTY DETAILS">
                        <div class="d-flex flex-column align-items-end align-items-md-start text-end text-md-start">
                            <div class="fw-bold text-dark text-wrap">${row[2]}</div>
                            <div class="mt-1 d-flex flex-wrap justify-content-end justify-content-md-start gap-1">
                                <span class="type-pill">${row[3] || '-'}</span> 
                                <span class="type-pill">${row[4] || '-'}</span>
                            </div>
                        </div>
                    </td>
                    <td data-label="STATUS">
                        <span class="status-badge ${isFound ? 'bg-success-light text-success' : 'bg-danger-light text-danger'}">
                            ${row[6]}
                        </span>
                    </td>
                    <td data-label="TIME LOG">
                        <div class="fw-bold text-dark">${row[7] || '0H 0M'}</div>
                        <div class="text-muted small">${row[5] || ''}</div>
                    </td>
                    <td class="text-end" data-label="ACTION">
                        <div class="action-container" id="actions-${row[0]}">
                            <div class="action-group">
                                <button type="button" class="btn btn-action btn-edit-mode edit-btn" data-row="${rowDataStr}">Edit</button>
                                <button type="button" class="btn btn-action btn-delete-mode" onclick="deleteEntry('${row[0]}')">Delete</button>
                            </div>
                        </div>
                    </td>
                </tr>`;
            });
            $('#entriesBody').html(html || '<tr><td colspan="6" class="text-center py-4 text-muted">No data found</td></tr>');
        } catch (err) {
            console.error("Table Load Error:", err);
        }
    }

    // --- 2. Delete Logic ---
    async function deleteEntry(hid) {
        if (confirm(`Are you sure you want to delete HID: ${hid} from the Database and Google Sheet?`)) {
            const response = await fetch(`/delete/${hid}`, { method: 'DELETE' });
            const result = await response.json();
            if (result.status === 'success') {
                refreshTable();
            } else {
                alert("Error deleting: " + result.message);
            }
        }
    }

    // --- MAIN JQUERY BLOCK ---
    $(document).ready(function() {
        // Init plugins
        $('.searchable-select').select2({ width: '100%' });
        flatpickr(".time-picker", { enableTime: true, noCalendar: true, dateFormat: "H:i:S", time_24hr: true, enableSeconds: true });
        
        refreshTable();

        // --- 3. Edit Button Click ---
        $('#entriesBody').on('click', '.edit-btn', function() {
            const rowDataStr = $(this).attr('data-row');
            const row = JSON.parse(decodeURIComponent(rowDataStr));
            const hid = row[0];

            // Populate form
            $('#hid').val(row[0]).prop('readonly', true); 
            $('#mls_name').val(row[2]).trigger('change'); 
            $('#prop_type').val(row[3]); 
            $('#home_type').val(row[4]);
            $('#listing_date').val(row[5]);
            
            if (row[6] === 'Found' || row[6] === 'Data Found') {
                $('#status').val('Found');
            } else {
                $('#status').val('Not Found');
            }
            
            $('#start_time').val('').removeAttr('required');
            $('#end_time').val('').removeAttr('required');
            
            isEditMode = true;

            // Update UI for editing
            $('#submitBtn').removeClass('btn-primary').addClass('btn-warning');
            $('#submitBtn').find('.btn-text').text('Update Entry'); // Fixed ID reference
            $('#msg').html(`
                <div class="container mt-3 mb-1">
                    <div class="alert alert-warning fw-bold border-0 shadow-sm d-flex align-items-center justify-content-center py-3" 
                         style="background-color: #fef3c7; color: #92400e; border-radius: 12px;">
                        <span class="me-2">✎</span> Editing Record HID: ${row[0]}
                    </div>
                </div>
            `);
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Toggle Edit/Cancel buttons in table safely
            let $actionTd = $(`#actions-${hid}`);
            $actionTd.children().hide(); // Hide edit/delete
            
            // Inject temp cancel button
            $actionTd.append(`
                <button type="button" class="btn btn-cancel-pill rounded-pill fw-bold cancel-temp-btn" data-hid="${hid}">
                    ✕ Cancel
                </button>
            `);
        });

        // --- 4. Cancel Button Click (Event Delegation) ---
        $('#entriesBody').on('click', '.cancel-temp-btn', function() {
            let hid = $(this).data('hid');

            isEditMode = false;
            $('#dataForm')[0].reset();
            $('#prop_type').trigger('change');
            $('#mls_name').val(null).trigger('change');
            
            $('#hid').prop('readonly', false); 
            $('#start_time').attr('required', true); 
            $('#end_time').attr('required', true);
            
            let $btn = $('#submitBtn');
            $btn.removeClass('is-loading is-success btn-warning').addClass('btn-primary').prop('disabled', false);
            $btn.css({'background-color': '', 'border-color': ''}); 
            $btn.find('.btn-text').text('Save Entry');
            
            // Restore table buttons
            let $actionTd = $(`#actions-${hid}`);
            $(this).remove(); 
            $actionTd.children().show(); 
            
            $('#msg').empty();
        });

        // --- 5. Submit Form Logic ---
        $('#dataForm').on('submit', async function(e) {
            e.preventDefault();

            if (!this.checkValidity()) {
                this.reportValidity();
                return; 
            }

            let $btn = $('#submitBtn');
            let $btnText = $btn.find('.btn-text');
            $btn.addClass('is-loading');

            const payload = {
                hid: $('#hid').val(), 
                mls_name: $('#mls_name').val(),
                prop_type: $('#prop_type').val(),
                home_type: $('#home_type').val(),
                listing_date: $('#listing_date').val(),
                status: $('#status').val(),
                start_time: $('#start_time').val(), 
                end_time: $('#end_time').val()
            };

            const endpoint = isEditMode ? '/update' : '/submit';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                
                if (!res.ok) {
                    const errData = await res.json();
                    throw new Error(errData.message || `Server returned ${res.status}`);
                }
                
                const result = await res.json();
                await new Promise(resolve => setTimeout(resolve, 600));

                if (result.status === "success") {
                    $btn.removeClass('is-loading btn-warning').addClass('is-success');
                    $btnText.html('&#10004; Saved!'); 
                    
                    $('#msg').html(`<div class="alert alert-success fw-bold border-0 shadow-sm" style="background-color: #dcfce7; color: #166534;">✅ ${result.message}</div>`);
                    
                    // Reset everything
                    $('#dataForm')[0].reset();
                    $('#mls_name').val(null).trigger('change');
                    $('#prop_type').trigger('change'); 
                    
                    if (isEditMode) {
                        isEditMode = false;
                        $('#hid').prop('readonly', false); 
                        $('#start_time').attr('required', true); 
                        $('#end_time').attr('required', true);
                    }
                    
                    refreshTable(); 

                    setTimeout(() => {
                        $btn.removeClass('is-success');
                        $btn.addClass('btn-primary'); // Ensure it goes back to primary color
                        $btnText.text('Save Entry'); 
                    }, 1500);
                }
            } catch (err) {
                $btn.removeClass('is-loading');
                $btnText.text(isEditMode ? 'Update Entry' : 'Save Entry'); 
                $('#msg').html(`<div class="alert alert-danger fw-bold border-0 shadow-sm" style="background-color: #fee2e2; color: #991b1b;">❌ Error: ${err.message}</div>`);
            } finally {
                setTimeout(() => { $('#msg').empty(); }, 5000);
            }
        });
    });
    </script>
</body>
</html>
